<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Hanged Man - Login</title>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" id="backHomeReg"><i class="fa-solid fa-circle-user"></i><&nbsp;Back Home</a>
        <a href="register.html" id="backRegPage"><i class="fa-solid fa-circle-user"></i><&nbsp;Register</a>
    </header>

    <main class="auth-page">
        <h1 id="loginTitle"><u>Login</u></h1>

        <div id="formLogin">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
        </div>

        <button id="loginBtn">Login Account</button>

        <a id="forgotPass">Forgot password?</a>

        <div id="message"></div>
    </main>

<script type="module" src="login.js"></script>
</body>
</html>
