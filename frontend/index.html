<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Hanged Man</title>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="hangman.png">
</head>
<body>
    <h1 id="title"><u>Hanged Man</u></h1>

    <div id="home">
        <header id="userHeader">
            <a href="register.html" id="login" class="fade-out-home"><i class="fa-solid fa-circle-user"></i>&nbsp;Login / Register</a>

            <div id="dropdown">
                <a id="logoutBtn"><i class="fa-solid fa-door-open"></i>&nbsp;Logout</a>
                <a id="deleteBtn"><i class="fa-solid fa-trash-can"></i>&nbsp;Delete Account</a>
            </div>
        </header>

        <main>
            <div class="container">
                <h1 class="fade-out-home" id="subtitle">Develop Your Vocabulary!</h1>
                <button class="fade-out-home" id="play"><b>Play!</b></button>
                <a href="history.html" class="fade-out-home" id="history"><b>History</b></a>
                <div id="homeMessage" class="fade-out-home"></div>
            </div>
        </main>
    </div>

    <div id="modalLogout">
        <div class="modal">
            <p>Are you sure you want to logout?</p>
            <div class="modalButtons">
                <button id="confirmLogout">Confirm</button>
                <button id="cancelLogout">Cancel</button>
            </div>
        </div>
    </div>

    <div id="modalDelete">
        <div class="modal">
            <p>Are you sure you want to delete your account? There is no turning back!</p>
            <div class="modalButtons">
                <button id="confirmDelete">Confirm</button>
                <button id="cancelDelete">Cancel</button>
            </div>
        </div>
    </div>

    <div id="game">
        <main>
            <svg class="fade-out-game" id="draw" width="200" height="250">
                <!--baza + stalp-->
                <g id="p1">
                    <line x1="20" y1="230" x2="20" y2="20" stroke="black" stroke-width="4"></line>
                    <line x1="5" y1="230" x2="35" y2="230" stroke="black" stroke-width="4"></line>
                </g>

                <!--suport-->
                <g id="p2">
                    <line x1="18" y1="20" x2="130" y2="20" stroke="black" stroke-width="4"></line>
                    <line x1="20" y1="40" x2="40" y2="20" stroke="black" stroke-width="4"></line>
                </g>

                <!--sfoara-->
                <line id="p3" x1="120" y1="45" x2="120" y2="20" stroke="black" stroke-width="4"></line>

                <!--cap-->
                <circle id="p4" cx="120" cy="65" r="20" stroke="black" stroke-width="4" fill="none"></circle>

                <!--corp-->
                <line id="p5" x1="120" y1="85" x2="120" y2="140" stroke="black" stroke-width="4"></line>

                <!--picioare-->
                <line id="p6" x1="120" y1="138" x2="100" y2="185" stroke="black" stroke-width="4"></line>
                <line id="p7" x1="120" y1="138" x2="140" y2="185" stroke="black" stroke-width="4"></line>

                <!--maini-->
                <line id="p8" x1="120" y1="100" x2="95" y2="125" stroke="black" stroke-width="4"></line>
                <line id="p9" x1="120" y1="100" x2="145" y2="125" stroke="black" stroke-width="4"></line>

                <!--fata-->
                <g id="p10">
                    <circle cx="128" cy="60" r="2" stroke="black" stroke-width="4" fill="black"></circle>
                    <circle cx="112" cy="60" r="2" stroke="black" stroke-width="4" fill="black"></circle>
                    <path d="M 112 78 Q 120 70 128 78" stroke="black" stroke-width="3" fill="none"></path>
                </g>
            </svg>

            <div class="fade-out-game" id="word"></div>

            <div class="fade-out-game" id="wrong"></div>

            <div id="keyboard" class="fade-out-game"></div>

            <div class="fade-out-game" id="lose-message"></div>

            <div class="fade-out-game" id="win-message"></div>

            <div class="fade-out-game" id="sln"></div>

            <div class="container">
                <button class="fade-out-game" id="restart"><b>New Game</b></button>
                <button class="fade-out-game" id="backHome"><b>Back to Home</b></button>
            </div>
        </main>
    </div>

<script type="module" src="index.js"></script>

</body>
</html>
