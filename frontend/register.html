<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Hanged Man - Register</title>
    <link href='https://fonts.googleapis.com/css?family=Poppins' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <a href="index.html" id="backHomeReg"><i class="fa-solid fa-circle-user"></i><&nbsp;Back Home</a>
</header>

    <main>
        <h1 id="registerTitle"><u>Register Account</u></h1>

        <div id="form">
            <input type="text" id="username" placeholder="Username">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <input type="password" id="confirm" placeholder="Confirm Password">
        </div>

        <button id="registerBtn">Create Account</button>

        <a href="login.html" id="accountExists">Already have an account? Login!</a>

        <div id="message"></div>
    </main>

    <script type="module" src="register.js"></script>
</body>
</html>
